[project]
name = "yu17-qmk-userspace"
version = "0.1.0"
description = "yu17's QMK keymaps (External Userspace) - tooling only, not a Python package"
requires-python = ">=3.11"
dependencies = [
    # QMK CLI
    "qmk",
    # qmk_firmware/requirements.txt
    "argcomplete",
    "colorama",
    "dotty-dict",
    "hid",
    "hjson",
    "jsonschema>=4",
    "milc>=1.9.0",
    "pygments",
    "pyserial",
    "pyusb",
    "pillow",
]

[tool.uv]
package = false
